[project]
name = "ailab-pro-runtime"
version = "0.1.0"
description = "Missed-Call AI Receptionist runtime (Twilio voice + SMS <-> Claude <-> calendar), with a local simulator."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "anthropic>=0.70",
  "twilio>=9.0",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "pydantic>=2.8",
  "jsonschema>=4.23",
  "cryptography>=43",
  "pyyaml>=6.0",
  "tzdata>=2024.1",
  "google-api-python-client>=2.140",
  "google-auth-oauthlib>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "sim"]

[tool.setuptools.package-data]
app = ["*.json"]
sim = ["tenants/*.json", "scenarios/*.yaml", "replays/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
