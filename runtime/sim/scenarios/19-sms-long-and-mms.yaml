description: SMS over 600 characters and MMS get fixed replies without Claude.
channel: sms
turns:
  - say: "Please read this carefully. ...................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................."
    expect: {reply_contains: ["shorter message"], claude_calls: 0, guard: [too_long]}
  - say: "photo of my unit"
    num_media: 1
    expect: {reply_contains: ["only read text"], claude_calls: 0, guard: [mms]}
expect: {claude_calls_total: 0}
