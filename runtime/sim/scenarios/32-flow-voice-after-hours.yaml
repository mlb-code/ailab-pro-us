description: Sunday 10:30 pm (closed), after_hours=book_next_day -> the call books Monday; the caller says yes to texts -> the confirmation is the direct response to that yes, so it goes out right away even at night (SA §8 item 5); the 24-hour reminder is not queued (visit less than a day ahead).
kind: flow
channel: voice
now: "2026-10-11T22:30:00-05:00"
steps:
  - call: {}
  - say: "My AC is blowing warm air, zip 77002"
    expect: {reply_matches: ["Monday,? Oct(ober)? 12"]}
  - say: "The morning one, my name is Ann Lee, 900 Main St Houston 77002"
    expect: {reply_matches: ["all set|booked"]}
  - say: "Yes"
    expect: {reply_contains: ["text your confirmation"]}
  - hangup: {}
expect: {outcome: booked, bookings: 1, sms_sent: 1, alerts: [booking], consent: {booking_texts: "yes"}}
