description: Happy path by text - problem, ZIP, slot choice, name, address -> booked.
channel: sms
turns:
  - say: "Hi, my AC is blowing warm air"
    expect: {reply_contains: ["ZIP"], claude_calls: 1}
  - say: "77005"
    expect: {reply_contains: ["Which works better"], tools: [get_availability]}
  - say: "The first one works"
    expect: {reply_contains: ["name"]}
  - say: "My name is Dana Miller"
    expect: {reply_contains: ["address"]}
  - say: "2100 Rice Blvd, Houston 77005"
    expect: {reply_contains: ["all set"], tools: [book_slot]}
  - say: "Thanks"
    expect: {tools: [end_conversation]}
expect: {outcome: booked, bookings: 1, actions: [booking], reply_never_matches: ["\\$"]}
