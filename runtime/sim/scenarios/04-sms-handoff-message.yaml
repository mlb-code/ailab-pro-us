description: Asking for a person by text -> no dial on SMS; HUMAN NEEDED alert and a message.
channel: sms
turns:
  - say: "I want to speak with the manager"
    expect: {tools: [handoff], reply_matches: ["call you back|get back to you|reach out|follow up"]}
expect: {outcome: message, actions: [human_needed], no_actions: [dial]}
