description: Streaming voice (ConversationRelay). The model streams like a live one (first sentence at once, 600 ms before the rest); the first guarded sentence must reach Twilio < 150 ms after the caller's final transcript (server time, Claude excluded), long before the full reply is done. Tool turns start with a fixed filler.
kind: flow
channel: voice
modes: [stream]
slow_model: {first_ms: 0, rest_ms: 600}
steps:
  - call: {}
  - say: "My AC stopped working"
    advance_seconds: 15
    expect: {reply_matches: ["technician"]}
  - say: "I'm in 77019"
    advance_seconds: 15
    expect: {reply_starts_with: "Let me check the schedule.", reply_matches: ["Which works better"]}
  - say: "The morning one, this is Dana Miller at 45 Westheimer Rd Houston 77019"
    advance_seconds: 20
    expect: {reply_starts_with: "One moment.", reply_matches: ["all set"]}
  - hangup: {}
    advance_seconds: 5
expect:
  outcome: booked
  bookings: 1
  events: {voice.latency: 1}
  latency_p95_ms_max: 150
  first_sentence: {server_p95_ms_max: 150, client_p95_ms_max: 150, total_p95_ms_min: 550}
