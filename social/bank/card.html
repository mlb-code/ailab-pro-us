<!doctype html>
<!-- Facebook post card, 1200x630. Rendered by social/bank/render.py (headless Chromium via Playwright).
     {{...}} placeholders are filled from social/bank/posts.json ("card") and config/brand.json (theme, fonts, name, domain).
     Open directly in a browser to preview: the placeholders then show as-is. -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="{{FONT}}">
<style>
:root{--ink:{{INK}};--ink2:{{INK2}};--paper:{{PAPER}};--violet:{{VIOLET}};--violet2:{{VIOLET2}};--deep:{{DEEP}};--amber:{{AMBER}}}
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;background:var(--ink);color:var(--paper);font-family:'Noto Sans',sans-serif;padding:64px 80px 56px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
body:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(242,240,247,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(242,240,247,.06) 1px,transparent 1px);background-size:60px 60px;-webkit-mask-image:radial-gradient(70% 90% at 82% 18%,#000,transparent)}
body:after{content:"";position:absolute;right:-220px;top:-280px;width:840px;height:840px;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--deep) 42%,transparent),transparent 70%)}
body>*{position:relative;z-index:1}
.k{font-family:'Space Mono',monospace;font-size:22px;letter-spacing:.16em;text-transform:uppercase;color:var(--violet2)}
.main{display:flex;flex-direction:column;gap:14px;max-width:1010px}
.num{font-family:'Noto Serif',serif;font-weight:800;color:var(--amber);font-size:150px;line-height:.9;letter-spacing:-.03em}
h1{font-size:76px;line-height:1.02;font-weight:800;letter-spacing:-.045em;font-variation-settings:"wdth" 86}
.has-num h1{font-size:58px;line-height:1.06}
h1 em{font-family:'Noto Serif',serif;font-style:italic;font-weight:700;color:var(--violet2);letter-spacing:-.02em;font-variation-settings:normal;
  background:linear-gradient(transparent 72%,color-mix(in srgb,var(--deep) 55%,transparent) 72%,color-mix(in srgb,var(--deep) 55%,transparent) 92%,transparent 92%);padding:0 .06em}
.sub{font-size:27px;line-height:1.3;color:rgba(242,240,247,.72);max-width:960px}
.sub:empty,.num:empty{display:none}
.f{display:flex;justify-content:space-between;align-items:center;border-top:1px solid rgba(242,240,247,.12);padding-top:26px}
.b{display:flex;align-items:center;gap:14px;font-size:32px;font-weight:800;letter-spacing:-.02em}
.b img{width:52px;height:52px}
.b small{font-family:'Space Mono',monospace;font-size:17px;color:var(--violet2);font-weight:400;letter-spacing:.2em}
.u{font-family:'Space Mono',monospace;font-size:26px;font-weight:700;color:var(--amber);letter-spacing:.04em}
</style></head>
<body class="{{BODYCLASS}}">
<div class="k">{{KICKER}}</div>
<div class="main"><div class="num">{{NUM}}</div><h1>{{TITLE}}</h1><p class="sub">{{SUB}}</p></div>
<div class="f"><span class="b"><img src="{{GEM}}" alt="">{{BRAND}} <small>US</small></span><span class="u">{{DOMAIN}}</span></div>
</body></html>
