<!-- Supabase Auth e-mail (magic link + 6-digit code). Used for both "magic_link" and "confirmation".
     {{BRAND_NAME}} / {{SUPPORT_EMAIL}} are filled from config/brand.json by tools/us_setup.py (step auth).
     {{ .Token }} and {{ .ConfirmationURL }} are Supabase template variables. Inline CSS, max 600px. -->
<div style="margin:0;padding:24px 12px;background:#f4f1ea;font-family:Arial,Helvetica,sans-serif;color:#0F1A26">
  <div style="max-width:600px;margin:0 auto;background:#ffffff;border-radius:12px;padding:28px 24px">
    <p style="margin:0 0 6px;font-size:14px;color:#5b6573">{{BRAND_NAME}}</p>
    <h1 style="margin:0 0 16px;font-size:22px;line-height:1.3">Your sign-in code</h1>
    <p style="margin:0 0 12px;font-size:15px;line-height:1.5">Enter this code on the sign-in page. It expires in 30 minutes.</p>
    <p style="margin:0 0 20px;font-family:'Courier New',monospace;font-size:32px;letter-spacing:6px;font-weight:bold">{{ .Token }}</p>
    <p style="margin:0 0 20px;font-size:15px;line-height:1.5">Or sign in with one click:<br>
      <a href="{{ .ConfirmationURL }}" style="display:inline-block;margin-top:10px;padding:12px 20px;background:#E8A64A;color:#0F1A26;text-decoration:none;border-radius:8px;font-weight:bold">Sign in</a></p>
    <p style="margin:0;font-size:13px;line-height:1.5;color:#5b6573">If you did not ask for this e-mail, you can ignore it. Questions: {{SUPPORT_EMAIL}}</p>
  </div>
</div>
